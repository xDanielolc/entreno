<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App de entrenamiento</title>
  <meta name="description" content="Registro de entrenamientos con progresión Bilbo y datos en tu Google Drive.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f2ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Presentación: la pesa entra a saltos y la caja del logo se cierra sobre
       ella. Dura menos de dos segundos y un toque la quita. -->
  <div id="presentacion" aria-hidden="true">
    <div class="escena">
      <div class="caja"></div>
      <div class="pesa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="disco" d="M6.5 7.5v9M3.5 10v4"/><path class="disco" d="M17.5 7.5v9M20.5 10v4"/><path d="M6.5 12h11"/></svg></div>
      <div class="nombre">Entreno</div>
    </div>
  </div>
  <header class="barra-superior">
    <span class="marca-app">Entreno</span>
    <button id="estado-sincronizacion" class="indicador" type="button" hidden></button>
  </header>
  <main id="vista" class="contenido">
    <noscript>Esta app necesita JavaScript activado.</noscript>
  </main>
  <nav id="navegacion" class="navegacion" aria-label="Secciones" hidden></nav>
</body>
</html>
